name: api-tests
on: [push, pull_request]
# Things that will be done on push and pull
jobs:
    test:
		# The system image which test runs
     runs-on: ubuntu-latest
     steps:
		# use github actions
        - uses: actions/checkout@v7
		# the terminal commands to run
        - run: sudo npm install -g postman-cli
        - run: |
            postman collection run \
            restful-booker.postman_collection.json \
            -r cli, junit \